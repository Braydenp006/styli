// The ink format: one page is an append-only log of Records, each written as
// a varint length followed by that many bytes of a Record message (the
// "delimited" framing of protodelim / parseDelimitedFrom). The first record is
// the Header. A log only ever grows; a cut-off last record is ignored.
//
// Never change a field number or its meaning. Add new fields and new event
// kinds with new numbers: readers skip what they do not know.
syntax = "proto3";

package styli.ink.v1;

option go_package = "styli/core/internal/ink/inkpb";
option java_package = "app.styli.ink.proto";
option java_multiple_files = true;

message Record {
  oneof body {
    Header header = 1;
    Event event = 2;
  }
}

message Header {
  // The format version, 1 for now. A reader refuses a larger one.
  uint32 version = 1;
}

// Page lengths and point positions are whole units of 0.01 mm, so a log never
// holds a float that could round differently on two devices.
message Event {
  // 16 random bytes naming the stroke or text box this event is about: the new
  // one for StrokeAdded and TextBoxSet, the target for StrokeErased and
  // TextBoxRemoved. Empty for Transformed and PageSet.
  bytes id = 1;
  // Who wrote it, and that device's own counter. (device, seq) is unique, so
  // the merge can tell a copy of an event from a different one.
  string device = 2;
  uint64 seq = 3;
  // Wall clock, milliseconds since 1970. For display and tie-breaks only.
  int64 at_ms = 4;

  oneof kind {
    StrokeAdded stroke_added = 10;
    StrokeErased stroke_erased = 11;
    Transformed transformed = 12;
    TextBoxSet text_box_set = 13;
    TextBoxRemoved text_box_removed = 14;
    PageSet page_set = 15;
    TableSet table_set = 16;
    TableRemoved table_removed = 17;
    ZMoved z_moved = 18;
    ShapeSet shape_set = 19;
    ShapeRemoved shape_removed = 20;
    ConnectorSet connector_set = 21;
    ConnectorRemoved connector_removed = 22;
    FillSet fill_set = 23;
    FillRemoved fill_removed = 24;
    ImageSet image_set = 25;
    ImageRemoved image_removed = 26;
    ChartSet chart_set = 27;
    ChartRemoved chart_removed = 28;
  }
}

enum Tool {
  TOOL_PEN = 0;
  TOOL_HIGHLIGHTER = 1;
  // The same path as a pen stroke, drawn as a row of round dots along it: a dot
  // 1.5 pen widths across every 3.5 pen widths. A reader that does not know it
  // can draw it as a pen stroke.
  TOOL_DOTTED = 2;
}

message StrokeAdded {
  Tool tool = 1;
  uint32 color = 2;  // 0xAARRGGBB, as drawn on a light page (dark mode maps it when showing)
  uint32 width = 3;  // pen width
  // Points, delta-coded: the first is (x0, y0), each next one adds dx[i], dy[i].
  sint32 x0 = 4;
  sint32 y0 = 5;
  repeated sint32 dx = 6 [packed = true];
  repeated sint32 dy = 7 [packed = true];
  // One per point, 0 to 255; empty for a mouse or finger (full pressure).
  bytes pressure = 8;
  // Milliseconds since the first point, delta-coded like dx; one per point
  // after the first. Empty when unknown.
  repeated uint32 dt = 9 [packed = true];
}

message StrokeErased {}

// Moves or resizes strokes and text boxes: the affine map
// x' = a*x + c*y + e, y' = b*x + d*y + f applied to every id listed.
message Transformed {
  repeated bytes ids = 1;
  double a = 2;
  double b = 3;
  double c = 4;
  double d = 5;
  double e = 6;
  double f = 7;
}

// The whole state of a text box. Adding, editing and moving are all this; the
// last one wins.
message TextBoxSet {
  sint32 x = 1;
  sint32 y = 2;
  uint32 width = 3;
  uint32 font_size = 4;
  string text = 5;
  // 0xAARRGGBB as on a light page, like a stroke's colour. A zero alpha (so
  // zero, and so absent in a log written before these were added) means: the
  // text in the page's ordinary ink colour, and no highlight behind it.
  uint32 color = 6;
  uint32 highlight = 7;
  // How far the box is turned clockwise on the page, in 0.01 degrees (a whole
  // number like every other unit here), about its top-left corner (x, y). Zero,
  // and so absent in a log written before this was added, means upright.
  sint32 angle = 8;
}

message TextBoxRemoved {}

// The whole state of a table, a ruled grid on the page: adding, moving, resizing
// the table or one of its lines is this event; the last one wins. The columns
// run left to right from the top-left corner (x, y) and the rows top to bottom,
// so the table is as wide as its column widths add up and as tall as its row
// heights. Ink is drawn over it; it has no angle.
message TableSet {
  sint32 x = 1;
  sint32 y = 2;
  repeated uint32 col_widths = 3 [packed = true];
  repeated uint32 row_heights = 4 [packed = true];
  uint32 line_width = 5;
  // 0xAARRGGBB as on a light page, like a stroke's colour; a zero alpha (so
  // zero) means the page's ordinary ink colour.
  uint32 color = 6;
  // The colour behind the whole table, drawn under its lines: 0xAARRGGBB, and a
  // zero alpha (so zero, and so absent in a log written before this was added)
  // means no fill.
  uint32 fill = 7;
  // One colour per cell, row by row from the top left (rows times columns of
  // them), drawn over the table's own fill: 0xAARRGGBB, and a zero alpha means
  // no fill for that cell. Empty (as in a log written before this was added)
  // means no cell has one.
  repeated uint32 cell_fills = 8 [packed = true];
}

message TableRemoved {}

// Layers. A page's objects (strokes, text boxes, tables, shapes, connectors, fills) sit
// in one order, bottom to top. A reader keeps a list: a new stroke, text box,
// shape, connector, picture or chart goes on top, a new table or fill goes at the bottom, a
// removed one leaves the list.
// ZMoved then puts the object named by Event.id just above the object `above`,
// or at the very bottom if `above` is empty. A writer emits one wherever the
// list it means differs from what those rules give (a bring-to-front, a piece
// left by a partial erase that keeps the place of the stroke it came from, an
// undo of either).
message ZMoved {
  bytes above = 1;
}

enum Template {
  TEMPLATE_BLANK = 0;
  TEMPLATE_LINED = 1;
  TEMPLATE_GRID = 2;
}

// The page's size and look. A page's orientation is whether width is larger
// than height. With infinite set the size is only the starting view.
message PageSet {
  uint32 width = 1;
  uint32 height = 2;
  Template template = 3;
  bool infinite = 4;
  // Where the page sits in its notebook's grid: column and row, counted from
  // the first page at (0, 0), rows downward and columns to the right. Zero, and
  // so absent in a log written before these were added, is that first cell.
  sint32 col = 5;
  sint32 row = 6;
}

enum LineStyle {
  LINE_SOLID = 0;
  LINE_DASHED = 1;
}

enum ShapeKind {
  SHAPE_RECT = 0;
  SHAPE_ELLIPSE = 1;
  // A closed outline through `vertices`; a triangle, diamond, star and the
  // other premade shapes are all this.
  SHAPE_POLYGON = 2;
}

// The whole state of a shape: adding, moving, resizing, turning, restyling or
// editing it is this event; the last one wins. The shape fills a box with its
// top-left corner at (x, y), `width` by `height`, turned clockwise about (x, y)
// by `angle` (0.01 degrees, like a text box). Drawn in the page's layers.
message ShapeSet {
  ShapeKind kind = 1;
  sint32 x = 2;
  sint32 y = 3;
  uint32 width = 4;
  uint32 height = 5;
  sint32 angle = 6;
  // The outline: 0xAARRGGBB as on a light page (a zero alpha, so zero, means the
  // page's ordinary ink colour), its width and its style.
  uint32 color = 7;
  uint32 line_width = 8;
  LineStyle line_style = 9;
  // The colour inside, 0xAARRGGBB; a zero alpha means none.
  uint32 fill = 10;
  // SHAPE_RECT: the corner radius. Zero is square corners.
  uint32 corner = 11;
  // SHAPE_POLYGON: x and y of each corner in turn, as a whole number of
  // 1/10000 of the box's width and height (0 to 10000), clockwise.
  repeated uint32 vertices = 12 [packed = true];
  // Text inside, centred and wrapped to the box; colour as above.
  string text = 13;
  uint32 text_color = 14;
  uint32 font_size = 15;
}

message ShapeRemoved {}

enum Arrowhead {
  ARROW_NONE = 0;
  ARROW_OPEN = 1;    // two strokes, like >
  ARROW_FILLED = 2;  // a solid triangle
  ARROW_DOT = 3;
}

// One end of a connector. With a `shape` the end sits on that shape's outline:
// where the line from the shape's centre towards `anchor` crosses it (1 top,
// 2 right, 3 bottom, 4 left: the middle of that side of the box), or towards
// the connector's other end if `anchor` is 0, or (anchor 5) at the spot (fx, fy)
// on the outline, as a whole number of 1/10000 of the shape's box width and
// height, so it stays in the same place on the shape as the shape is moved,
// resized or turned. Without a shape it is the free point (x, y). (x, y) is
// also where the end was when last written, for a reader that cannot find the
// shape.
message ConnectorEnd {
  bytes shape = 1;
  uint32 anchor = 2;
  sint32 x = 3;
  sint32 y = 4;
  uint32 fx = 5;
  uint32 fy = 6;
}

enum ConnectorRoute {
  ROUTE_STRAIGHT = 0;
  // Right angles: it leaves a shape at right angles to its edge, then bends once or twice.
  ROUTE_ELBOW = 1;
  // A smooth curve that leaves a shape at right angles to its edge.
  ROUTE_CURVE = 2;
}

// The whole state of a connector, a straight line between two ends with an
// optional arrowhead at each; the last event wins. It follows the shapes it is
// attached to. Drawn in the page's layers.
message ConnectorSet {
  ConnectorEnd from = 1;
  ConnectorEnd to = 2;
  Arrowhead from_head = 3;
  Arrowhead to_head = 4;
  uint32 color = 5;  // as a shape's outline colour
  uint32 line_width = 6;
  LineStyle line_style = 7;
  ConnectorRoute route = 8;
  // How far the middle of the route is pushed from where it would be, in page
  // units: sideways for a curve, along the span for an elbow's middle segment.
  // Zero (and so absent in a log written before this was added) is the default.
  sint32 bend = 9;
  // Extra points the route passes through between its two ends, each as x then
  // y in page units, in order from the first end. A curve runs smoothly through
  // them, an elbow turns at right angles between them and a straight route
  // bends at them. With any, `bend` is not used.
  repeated sint32 via = 10 [packed = true];
}

message ConnectorRemoved {}

// Paint poured into a closed area: filled rings (the first is the outside, any
// others are holes, even-odd), delta-coded like a stroke. A fill is only
// colour, it does not follow the lines that closed the area. New ones go at
// the bottom of the layers.
message Ring {
  sint32 x0 = 1;
  sint32 y0 = 2;
  repeated sint32 dx = 3 [packed = true];
  repeated sint32 dy = 4 [packed = true];
}

message FillSet {
  uint32 color = 1;  // 0xAARRGGBB as on a light page
  repeated Ring rings = 2;
}

message FillRemoved {}

// A picture on the page. The whole state of it, written like a shape (the last
// event wins). The pixels are not in the log: the picture's own file (as it
// was picked, never changed) is an attached file of the note's group, named by
// its hash, and this only points at it. Drawn in the page's layers.
message ImageSet {
  // Where the picture is on the page and how big, in page units; `angle` in
  // 0.01 degrees clockwise about the top left corner, like a text box.
  sint32 x = 1;
  sint32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
  sint32 angle = 5;
  // The part of the file that shows, as a whole number of 1/10000 of the
  // file's width and height (so cropping hides the rest and loses nothing).
  // A zero width or height, so a log with none, shows the whole file.
  uint32 crop_x = 6;
  uint32 crop_y = 7;
  uint32 crop_w = 8;
  uint32 crop_h = 9;
  // The attached file's path relative to the page's log, and the SHA-256 of its
  // bytes: the sync layer names and checks the file by this hash.
  string file = 10;
  bytes sha256 = 11;
  // The file's size in pixels, after any rotation its metadata asks for, so a
  // reader can lay the picture out without opening the file.
  uint32 src_width = 12;
  uint32 src_height = 13;
}

message ImageRemoved {}

enum ChartKind {
  CHART_BAR = 0;
  CHART_LINE = 1;
  CHART_PIE = 2;
  CHART_AREA = 3;
  CHART_DONUT = 4;
  CHART_RADAR = 5;
  // Like a radar, but each category is a wedge with the same angle and the value is its radius.
  CHART_POLAR = 6;
  // The first series, one centred bar per category, widest value first as given.
  CHART_FUNNEL = 7;
  // The first series are the steps (changes), running on from each other; the
  // categories listed in `totals` instead show the running total so far.
  CHART_WATERFALL = 8;
  // Each series has its own kind (bar, line or area) and may use a second axis on the right.
  CHART_COMBO = 9;
  // One value (the first series, first category) on a dial between gauge_min and
  // gauge_max; a second category, if there is one, is a target mark.
  CHART_GAUGE = 10;
  // A small line with no axes, labels or legend.
  CHART_SPARKLINE = 11;
  // Four series in order: open, high, low, close.
  CHART_CANDLESTICK = 12;
  // Each series is a set of points: `xs` and `values` (y) pairs, and, for a
  // bubble chart, `sizes`. Categories, if there are any, label the points.
  CHART_SCATTER = 13;
  CHART_BUBBLE = 14;
  // The first series' values are raw samples, counted into bins (see `bins`, `bin_width`).
  CHART_HISTOGRAM = 15;
  // Each series' values are samples; one box each (median, quartiles, whiskers, outliers).
  CHART_BOXPLOT = 16;
  // Categories are the rows, series the columns, values the cells, shaded from `heat_low` to `heat_high`.
  CHART_HEATMAP = 17;
  // The first series are the sizes, categories the tiles; `groups` (one per category, if any) nests them.
  CHART_TREEMAP = 18;
  // Categories are the tasks; the first series are the starts, the second the ends and the third (optional) the percent done.
  CHART_GANTT = 19;
  // Each row is a flow: the category is where it starts, `groups` where it ends, the first series how much.
  CHART_SANKEY = 20;
  // Each row's category is a path ("Food/Fruit/Apple"), the first series the size of that leaf; rings by depth.
  CHART_SUNBURST = 21;
  // Events along a line: the category is the name, the first series when (and the second, if any, when it ends).
  CHART_TIMELINE = 22;
  // One day per row: the category is a date ("2026-12-01"), the first series the value, drawn as a calendar of squares.
  CHART_CALENDAR = 23;
  // Curves y = f(x): each series' `expr` is a formula in x, drawn over the x range (and the y range, if given).
  CHART_FUNCTION = 24;
}

// How a line (or the top of an area) joins its points.
enum ChartCurve {
  CURVE_STRAIGHT = 0;
  CURVE_SMOOTH = 1;
  CURVE_STEP = 2;
}

// One series of a chart: a name, a colour and one value per category. Values
// are whole numbers in thousandths (12.5 is 12500), so no float is stored.
message ChartSeries {
  string name = 1;
  uint32 color = 2;  // 0xAARRGGBB as on a light page
  repeated sint64 values = 3 [packed = true];
  // Indices of the categories this series has no value for (left blank; the
  // number in `values` at that place is ignored). A line skips it, a bar is not drawn.
  repeated uint32 missing = 4 [packed = true];
  // Combo charts: how this series is drawn (bar, line or area; zero is bar).
  ChartKind kind = 5;
  // Combo charts: use the second axis, on the right.
  bool secondary = 6;
  // Draw a straight line of best fit through this series' values.
  bool trendline = 7;
  // Scatter and bubble charts: where each point is along the bottom (`values` is
  // how high), and for a bubble its size, all in thousandths. Same length as `values`.
  repeated sint64 xs = 8 [packed = true];
  repeated sint64 sizes = 9 [packed = true];
  // Error bars: how far each value could be out either way, in thousandths (same length as `values`; zero draws none).
  repeated sint64 errors = 10 [packed = true];
  // Function charts: the formula, such as "sin(x) / x" or "2x^2 - 3".
  string expr = 11;
}

// A chart on the page, drawn from its data. The whole state of it, written like
// a shape (the last event wins). The data is always here, so a reader that does
// not know where it came from can still draw it; with a source table the app
// refreshes it from the table's typed cells and writes a new event.
message ChartSet {
  ChartKind kind = 1;
  // The box on the page in page units, `angle` as for a text box.
  sint32 x = 2;
  sint32 y = 3;
  uint32 width = 4;
  uint32 height = 5;
  sint32 angle = 6;
  string title = 7;
  // The x axis labels (the slices of a pie), and the series. A pie draws the first series.
  repeated string categories = 8;
  repeated ChartSeries series = 9;
  string x_label = 10;
  string y_label = 11;
  // Set to turn off what is on unless said otherwise, so a log with none of
  // these shows the legend and the gridlines.
  bool hide_legend = 12;
  bool hide_grid = 13;
  // Bars: stacked instead of side by side.
  bool stacked = 14;
  // Text colour (0xAARRGGBB; zero alpha means the page's ordinary ink colour) and
  // the base font size in page units (zero: the reader's choice).
  uint32 text_color = 15;
  uint32 font_size = 16;
  // Where the data came from, if it follows a table: the table's ID and the
  // block of its cells (first row and column, how many of each) read as the
  // categories and series; with `series_in_rows` each row is a series, otherwise
  // each column is. The first row and column of the block are the labels.
  bytes source_table = 17;
  uint32 src_row = 18;
  uint32 src_col = 19;
  uint32 src_rows = 20;
  uint32 src_cols = 21;
  bool series_in_rows = 22;
  // Bars run sideways (categories down the side).
  bool horizontal = 23;
  // Stacked bars and areas show each category as shares of 100 (needs `stacked`).
  bool percent = 24;
  ChartCurve curve = 25;
  // Lines and radars: leave the dots off.
  bool hide_markers = 26;
  // Donut: the hole as a whole percent of the radius; zero is the default, 55.
  uint32 hole = 27;
  // Radar: shade the inside.
  bool filled = 28;
  // A tilted, extruded look for bars, pies, donuts, areas and lines (still a flat picture, not a turnable scene).
  bool three_d = 29;
  // Waterfall: categories that show the running total.
  repeated uint32 totals = 30 [packed = true];
  // Write the value on each bar, point or slice.
  bool show_values = 31;
  // Gauge: the ends of the dial in thousandths; a max not above the min means 0 to 100.
  sint64 gauge_min = 32;
  sint64 gauge_max = 33;
  // Population pyramid: with `horizontal`, the first series runs to the left of zero, the second to the right.
  bool pyramid = 34;
  // Gantt: the starts and ends are dates, as days since 1970-01-01 (in thousandths), shown as dates.
  bool date_axis = 35;
  // Treemap: the group each category belongs to (same length as `categories`, or empty for none).
  repeated string groups = 36;
  // Histogram: the number of bins, or the width of one (thousandths); zero for both means a count chosen from the samples.
  uint32 bins = 37;
  sint64 bin_width = 38;
  // Box plot: leave out the dots beyond the whiskers; mark the mean.
  bool hide_outliers = 39;
  bool show_mean = 40;
  // Gantt: a vertical line at this value (thousandths; zero for none), such as today.
  sint64 marker = 41;
  // Heatmap: the colours for the lowest and highest values (0xAARRGGBB; zero alpha means the defaults, pale blue and blue).
  uint32 heat_low = 42;
  uint32 heat_high = 43;
  // Function charts: the range drawn, in thousandths. A range whose max is not above its min means -10 to 10 for x and, for y, fitting the curves.
  sint64 x_min = 44;
  sint64 x_max = 45;
  sint64 y_min = 46;
  sint64 y_max = 47;
}

message ChartRemoved {}
